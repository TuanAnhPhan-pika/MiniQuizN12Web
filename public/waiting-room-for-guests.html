<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng chờ – Mini Quiz Classroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/home.css" />
  <link rel="stylesheet" href="css/waiting-room.css" />
</head>
<body>

<!-- ── SKY / CLOUDS ── -->
<div class="sky">
  <div class="cloud cloud-1"><svg width="260" height="80" viewBox="0 0 260 80" fill="none"><ellipse cx="130" cy="56" rx="120" ry="28" fill="white"/><ellipse cx="90" cy="42" rx="60" ry="34" fill="white"/><ellipse cx="160" cy="38" rx="52" ry="30" fill="white"/><ellipse cx="220" cy="52" rx="36" ry="22" fill="white"/><ellipse cx="40" cy="52" rx="34" ry="22" fill="white"/></svg></div>
  <div class="cloud cloud-2"><svg width="180" height="60" viewBox="0 0 180 60" fill="none"><ellipse cx="90" cy="42" rx="82" ry="20" fill="white"/><ellipse cx="60" cy="30" rx="44" ry="26" fill="white"/><ellipse cx="120" cy="28" rx="38" ry="22" fill="white"/><ellipse cx="155" cy="38" rx="24" ry="16" fill="white"/></svg></div>
  <div class="cloud cloud-3"><svg width="140" height="50" viewBox="0 0 140 50" fill="none"><ellipse cx="70" cy="36" rx="62" ry="16" fill="white"/><ellipse cx="46" cy="26" rx="34" ry="22" fill="white"/><ellipse cx="96" cy="24" rx="30" ry="20" fill="white"/></svg></div>
  <div class="cloud cloud-4"><svg width="300" height="64" viewBox="0 0 300 64" fill="none"><ellipse cx="150" cy="48" rx="138" ry="18" fill="white"/><ellipse cx="100" cy="34" rx="62" ry="28" fill="white"/><ellipse cx="200" cy="30" rx="56" ry="26" fill="white"/><ellipse cx="260" cy="44" rx="36" ry="18" fill="white"/><ellipse cx="46" cy="44" rx="40" ry="20" fill="white"/></svg></div>
  <div class="cloud cloud-5"><svg width="100" height="40" viewBox="0 0 100 40" fill="none"><ellipse cx="50" cy="28" rx="44" ry="14" fill="white"/><ellipse cx="34" cy="20" rx="24" ry="18" fill="white"/><ellipse cx="68" cy="18" rx="22" ry="16" fill="white"/></svg></div>
  <div class="cloud cloud-6"><svg width="220" height="70" viewBox="0 0 220 70" fill="none"><ellipse cx="110" cy="52" rx="100" ry="20" fill="white"/><ellipse cx="72" cy="36" rx="52" ry="30" fill="white"/><ellipse cx="148" cy="32" rx="46" ry="28" fill="white"/><ellipse cx="192" cy="48" rx="28" ry="18" fill="white"/></svg></div>
</div>

<!-- Sun / Moon -->
<div class="sky-body">
  <div class="sun-wrap">
    <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <g stroke="#FFD700" stroke-width="3.5" stroke-linecap="round">
        <line x1="40" y1="2"  x2="40" y2="19"/>
        <line x1="40" y1="61" x2="40" y2="78"/>
        <line x1="2"  y1="40" x2="19" y2="40"/>
        <line x1="61" y1="40" x2="78" y2="40"/>
        <line x1="13.1" y1="13.1" x2="24.9" y2="24.9"/>
        <line x1="55.1" y1="55.1" x2="66.9" y2="66.9"/>
        <line x1="66.9" y1="13.1" x2="55.1" y2="24.9"/>
        <line x1="24.9" y1="55.1" x2="13.1" y2="66.9"/>
      </g>
    </svg>
  </div>
  <div class="sun"></div>
  <div class="moon"></div>
</div>

<div class="stars" id="stars"></div>

<!-- ── HEADER ── -->
<header>
  <a href="dashboard.html" class="app-title" id="app-title" title="Về Bảng điều khiển"></a>
  <div class="header-right">
    <button class="btn-dark" id="btn-dark" title="Chuyển chế độ tối/sáng">
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="2"  x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2"  y1="12" x2="5"  y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.2" y1="4.2"  x2="6.3" y2="6.3"/>
        <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/>
        <line x1="19.8" y1="4.2"  x2="17.7" y2="6.3"/>
        <line x1="6.3"  y1="17.7" x2="4.2"  y2="19.8"/>
      </svg>
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <button class="btn-logout" id="btn-leave-room" onclick="handleLeaveWaitingRoom()" style="background:#ef4444; color:#fff; border-radius:8px; padding:6px 14px; border:none; cursor:pointer; font-weight:700; font-size:0.9rem;">✕ Thoát phòng</button>
  </div>
</header>

<!-- ── MAIN CONTENT ── -->
<main class="waiting-main">

  <!-- 1. PHÍA TRÊN CÙNG: ĐẶT MÃ PIN -->
  <div class="pin-banner-card">
    <div class="pin-banner-label">Mã PIN phòng thi</div>
    <div class="pin-banner-code-wrap">
      <span class="pin-banner-code" id="pin-display">--- ---</span>
      <button class="pin-copy-action-btn" id="btn-copy-pin" onclick="copyPinCode()" title="Sao chép đường dẫn tham gia phòng thi">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>
    <div class="pin-banner-info">
      <span class="pin-banner-title" id="room-title-display">Đang kết nối phòng thi...</span>
    </div>
  </div>

  <!-- 2. PHÍA DƯỚI: DANH SÁCH NHỮNG NGƯỜI CHƠI KHÁC TRONG PHÒNG -->
  <div class="players-board-card">
    <div class="players-board-header">
      <div class="players-board-title">
        <span>👥 Người chơi trong phòng</span>
      </div>
      <span class="players-count-pill" id="players-count-badge">0 người</span>
    </div>

    <!-- Lưới hiển thị Avatar tròn + Nickname -->
    <div class="players-grid" id="players-grid">
      <div class="empty-players-hint">Đang tải danh sách người chơi...</div>
    </div>
  </div>

  <!-- 3. THANH TRẠNG THÁI CHO KHÁCH -->
  <div class="waiting-bottom-bar">
    <div class="guest-wait-status" id="guest-status-box">
      <span>⏳ Đang đợi chủ phòng bắt đầu bài thi...</span>
    </div>
  </div>

</main>

<!-- Modal thông báo khi phòng bị chủ phòng hủy -->
<div class="cancelled-modal-overlay" id="cancelled-modal">
  <div class="cancelled-modal-card">
    <div class="cancelled-modal-icon">🚫</div>
    <div class="cancelled-modal-title">Thông báo</div>
    <div class="cancelled-modal-desc">Phòng thi đã bị hủy</div>
    <button class="btn-cancelled-ok" onclick="confirmExitAfterCancelled()">Quay về trang chính</button>
  </div>
</div>

<!-- Lớp phủ đếm ngược 5 4 3 2 1 trên nền xám mờ -->
<div class="countdown-overlay" id="countdown-overlay">
  <div class="countdown-subhead">Bài thi chuẩn bị bắt đầu!</div>
  <div class="countdown-number" id="countdown-num">5</div>
  <div class="countdown-tip">Hãy sẵn sàng làm bài, chúc bạn đạt kết quả cao!</div>
</div>

<footer>© 2026 Mini Quiz Classroom</footer>

  <script src="js/auth-client.js"></script>
  <script src="js/waiting-room-for-guests.js"></script>

</body>
</html>
