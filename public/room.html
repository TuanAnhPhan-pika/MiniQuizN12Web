<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phòng thi – Mini Quiz Classroom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/room.css" />
</head>
<body>

<!-- ── SKY / CLOUDS ── -->
<div class="sky">
  <div class="cloud cloud-1">
    <svg width="260" height="80" viewBox="0 0 260 80" fill="none"><ellipse cx="130" cy="56" rx="120" ry="28" fill="white"/><ellipse cx="90" cy="42" rx="60" ry="34" fill="white"/><ellipse cx="160" cy="38" rx="52" ry="30" fill="white"/><ellipse cx="220" cy="52" rx="36" ry="22" fill="white"/><ellipse cx="40" cy="52" rx="34" ry="22" fill="white"/></svg>
  </div>
  <div class="cloud cloud-2">
    <svg width="180" height="60" viewBox="0 0 180 60" fill="none"><ellipse cx="90" cy="42" rx="82" ry="20" fill="white"/><ellipse cx="60" cy="30" rx="44" ry="26" fill="white"/><ellipse cx="120" cy="28" rx="38" ry="22" fill="white"/><ellipse cx="155" cy="38" rx="24" ry="16" fill="white"/></svg>
  </div>
  <div class="cloud cloud-3">
    <svg width="140" height="50" viewBox="0 0 140 50" fill="none"><ellipse cx="70" cy="36" rx="62" ry="16" fill="white"/><ellipse cx="46" cy="26" rx="34" ry="22" fill="white"/><ellipse cx="96" cy="24" rx="30" ry="20" fill="white"/></svg>
  </div>
  <div class="cloud cloud-4">
    <svg width="300" height="64" viewBox="0 0 300 64" fill="none"><ellipse cx="150" cy="48" rx="138" ry="18" fill="white"/><ellipse cx="100" cy="34" rx="62" ry="28" fill="white"/><ellipse cx="200" cy="30" rx="56" ry="26" fill="white"/><ellipse cx="260" cy="44" rx="36" ry="18" fill="white"/><ellipse cx="46" cy="44" rx="40" ry="20" fill="white"/></svg>
  </div>
  <div class="cloud cloud-5">
    <svg width="100" height="40" viewBox="0 0 100 40" fill="none"><ellipse cx="50" cy="28" rx="44" ry="14" fill="white"/><ellipse cx="34" cy="20" rx="24" ry="18" fill="white"/><ellipse cx="68" cy="18" rx="22" ry="16" fill="white"/></svg>
  </div>
  <div class="cloud cloud-6">
    <svg width="220" height="70" viewBox="0 0 220 70" fill="none"><ellipse cx="110" cy="52" rx="100" ry="20" fill="white"/><ellipse cx="72" cy="36" rx="52" ry="30" fill="white"/><ellipse cx="148" cy="32" rx="46" ry="28" fill="white"/><ellipse cx="192" cy="48" rx="28" ry="18" fill="white"/></svg>
  </div>
</div>

<div class="stars" id="stars"></div>
<!-- ── HEADER ── -->
<header>
  <a href="dashboard.html" class="app-title" id="app-title" title="Về Bảng điều khiển"></a>
  <div class="header-right">
    <button class="btn-dark" id="btn-dark" title="Chuyển chế độ tối/sáng">
      <!-- sun icon -->
      <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="2"  x2="12" y2="5"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
        <line x1="2"  y1="12" x2="5"  y2="12"/>
        <line x1="19" y1="12" x2="22" y2="12"/>
        <line x1="4.2" y1="4.2"  x2="6.3" y2="6.3"/>
        <line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/>
        <line x1="19.8" y1="4.2"  x2="17.7" y2="6.3"/>
        <line x1="6.3"  y1="17.7" x2="4.2"  y2="19.8"/>
      </svg>
      <!-- moon icon -->
      <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
    <div class="login-wrap" id="room-auth-area">
      <button class="btn-login">Đăng nhập / Đăng ký</button>
      <div class="tooltip">Không thể thực hiện đăng nhập khi đang làm bài</div>
    </div>
  </div>
</header>

<!-- Sun / Moon -->
<div class="sky-body">
  <div class="sun-wrap">
    <svg viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <!-- rays -->
      <g stroke="#FFD700" stroke-width="3.5" stroke-linecap="round">
        <line x1="40" y1="2"  x2="40" y2="19"/>
        <line x1="40" y1="61" x2="40" y2="78"/>
        <line x1="2"  y1="40" x2="19" y2="40"/>
        <line x1="61" y1="40" x2="78" y2="40"/>
        <line x1="13.1" y1="13.1" x2="24.9" y2="24.9"/>
        <line x1="55.1" y1="55.1" x2="66.9" y2="66.9"/>
        <line x1="66.9" y1="13.1" x2="55.1" y2="24.9"/>
        <line x1="24.9" y1="55.1" x2="13.1" y2="66.9"/>
      </g>
    </svg>
  </div>
  <div class="sun"></div>
  <div class="moon"></div>
</div>
<!-- Stars (dark mode) -->
<div class="stars" id="stars"></div>

<!-- ── MAIN ── -->
<main>
  <div class="quiz-col">

    <!-- Live score badge -->
    <div class="score-badge">Điểm hiện tại: <span id="total-score">0</span></div>

    <!-- Timer bar -->
    <div class="timer-wrap">
      <div class="timer-label">Thời gian</div>
      <div class="timer-bar-bg"><div class="timer-bar" id="timer-bar"></div></div>
      <div class="timer-secs" id="timer-secs">15</div>
    </div>

    <!-- Question card -->
    <div class="question-card" id="question-card">
      <div class="question-meta" id="question-meta">Câu 1 / 3</div>
      <div class="question-text" id="question-text"></div>
      <div class="choices" id="choices"></div>
    </div>

    <!-- Result panel (shown after each question) -->
    <div class="result-panel" id="result-panel">
      <div class="result-title" id="result-title"></div>
      <div class="result-score-earned" id="result-score-earned"></div>
      <div class="result-total" id="result-total"></div>

      <!-- Leaderboard -->
      <div class="leaderboard">
        <!-- Podium bars -->
        <div class="podium" id="podium">
          <div class="podium-slot" id="pod-2">
            <div class="pod-info">
              <img class="pod-avatar" id="pod-av-2" src="" alt=""/>
              <div class="pod-name" id="pod-name-2"></div>
              <div class="pod-score" id="pod-score-2"></div>
            </div>
            <div class="pod-bar bar-red" id="pod-bar-2"></div>
            <div class="pod-label">🥈</div>
          </div>
          <div class="podium-slot" id="pod-1">
            <div class="pod-info">
              <img class="pod-avatar" id="pod-av-1" src="" alt=""/>
              <div class="pod-name" id="pod-name-1"></div>
              <div class="pod-score" id="pod-score-1"></div>
            </div>
            <div class="pod-bar bar-gold" id="pod-bar-1"></div>
            <div class="pod-label">🥇</div>
          </div>
          <div class="podium-slot" id="pod-3">
            <div class="pod-info">
              <img class="pod-avatar" id="pod-av-3" src="" alt=""/>
              <div class="pod-name" id="pod-name-3"></div>
              <div class="pod-score" id="pod-score-3"></div>
            </div>
            <div class="pod-bar bar-green" id="pod-bar-3"></div>
            <div class="pod-label">🥉</div>
          </div>
        </div>
        <!-- Full list (rank 4+) -->
        <div id="leaderboard-rows"></div>
      </div>
    </div>

    <!-- Final screen -->
    <div class="final-panel" id="final-panel">
      <div class="final-trophy" id="final-trophy">🏆</div>
      <div class="final-title">Hoàn thành!</div>
      <div class="final-score" id="final-score"></div>
      <div class="final-rank" id="final-rank"></div>
      <a class="btn-home" href="index.html">← Về trang chủ</a>
      <button class="btn-review" id="btn-review" onclick="showReview()"> Xem lại bài làm</button>
    </div>

    <!-- Review / Stats screen -->
    <div class="review-panel" id="review-panel">
      <div class="review-header">
        <h2 class="review-title">Chi tiết bài làm</h2>
        <button class="btn-back-final" onclick="backToFinal()">✕ Đóng</button>
      </div>

      <!-- Top 3 summary -->
      <div class="review-section-box">
        <div class="box-title">🏆 Top 3 </div>
        <div class="review-top3" id="review-top3-list"></div>
      </div>

      <!-- Personal Rank & Score & Pie Chart -->
      <div class="review-summary-grid">
        <div class="personal-card">
          <div class="personal-label">Thứ hạng của bạn</div>
          <div class="personal-rank-val" id="review-my-rank">#1</div>
          <div class="personal-score-val" id="review-my-score">0 điểm</div>
        </div>

        <div class="chart-card">
          <div class="chart-title">Thống kê</div>
          <div class="chart-content">
            <div class="pie-chart" id="pie-chart"></div>
            <div class="chart-legend">
              <div class="legend-item"><span class="legend-dot dot-correct"></span> Đúng: <b id="stat-correct-count">0</b></div>
              <div class="legend-item"><span class="legend-dot dot-wrong"></span> Sai / Bỏ qua: <b id="stat-wrong-count">0</b></div>
              <div class="legend-highlight">Tỉ lệ đúng: <b id="stat-accuracy-rate">0%</b></div>
            </div>
          </div>
        </div>
      </div>

      <!-- Detail Questions List (Separate Scroll) -->
      <div class="review-section-box">
        <div class="box-title">Chi tiết</div>
        <div class="review-questions-scroll" id="review-questions-scroll"></div>
      </div>

      <a class="btn-home" href="index.html">← Về trang chủ</a>
    </div>

  </div>
</main>

<footer>© 2026 Mini Quiz Classroom</footer>

  <script src="js/room.js"></script>
</body>
</html>
